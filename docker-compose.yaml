services:
  opus-mt:
    build: .
    volumes:
      - ./models:/usr/src/app/models
      - ./services.json:/usr/src/app/services.json
      - ./server.py:/usr/src/app/server.py
    ports:
      - 8888:80
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/languages', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 20s

  opus-api:
    build: ./api
    ports:
      - 8000:8000
    environment:
      OPUS_URL: http://opus-mt:80
      OPUS_BATCH_SIZE: "64"
      OPUS_TIMEOUT: "360"
    depends_on:
      opus-mt:
        condition: service_healthy

